name: Refresh RSS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "feeds/**"
      - "rss.xml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh feeds
        env:
          BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
        run: npm run refresh

      - name: Commit feed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds rss.xml
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh RSS feeds"
          git push
